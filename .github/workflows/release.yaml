name: Release

on:
  pull_request:
  push:
    branches: [master]
    tags: ["*.*.*"]

permissions:
  contents: read

jobs:
  # Pull requests and master: build packages without publishing anything,
  # with a read-only token.
  snapshot:
    if: "!startsWith(github.ref, 'refs/tags/')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build
        run: make dist GORELEASER_ARGS=--snapshot

  release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build
        run: make dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate artifact attestations
        uses: actions/attest@v4
        with:
          subject-checksums: dist/checksums.txt
        id: attest
      - name: Upload Sigstore bundle
        run: |
          cp "${ATTEST_BUNDLE_PATH}" artifact-attestation.sigstore.json
          gh release upload "$(jq -r .tag <dist/metadata.json)" artifact-attestation.sigstore.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ATTEST_BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
      - name: Upload to Packagecloud
        run: |
          gem install --no-document --user-install --bindir ~/.local/bin package_cloud
          export CLICOLOR_FORCE=1
          ~/.local/bin/package_cloud push ${{ github.repository }}/any/any dist/*.deb
          ~/.local/bin/package_cloud push ${{ github.repository }}/rpm_any/rpm_any dist/*.rpm
        env:
          PACKAGECLOUD_TOKEN: ${{ secrets.PACKAGECLOUD_TOKEN }}
