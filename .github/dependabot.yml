version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    # Give new releases time to be vetted before proposing them
    cooldown:
      default-days: 7
    groups:
      golang-x:
        patterns:
          - golang.org/x/*
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
